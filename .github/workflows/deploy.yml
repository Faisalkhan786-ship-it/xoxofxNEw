name: Deploy XoxoFX API

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "Rentelligence.AI/XoxoFX_Apis.csproj"

      - name: Publish API
        run: dotnet publish "Rentelligence.AI/XoxoFX_Apis.csproj" -c Release -o "${{ github.workspace }}\publish" --no-restore

      - name: Upload Published API
        uses: actions/upload-artifact@v4
        with:
          name: xoxofx-api
          path: ${{ github.workspace }}\publish


  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Download Published API
        uses: actions/download-artifact@v4
        with:
          name: xoxofx-api
          path: C:\actions-runner\deploy

      - name: Deploy to Live Server
        shell: powershell
        run: |
          $source = "C:\actions-runner\deploy"
          $destination = "C:\inetpub\vhosts\smtpmails.online\httpdocs"

          Write-Host "Starting deployment..."

          if (Test-Path "$destination\app_offline.htm") {
              Remove-Item "$destination\app_offline.htm" -Force
          }

          New-Item -Path "$destination\app_offline.htm" -ItemType File -Force | Out-Null

          Start-Sleep -Seconds 5

          robocopy $source $destination /E /R:3 /W:5 /XF appsettings.json appsettings.Development.json

          if ($LASTEXITCODE -le 7) {
              Remove-Item "$destination\app_offline.htm" -Force
              Write-Host "Deployment completed successfully."
              exit 0
          }
          else {
              Write-Host "Deployment failed."
              exit $LASTEXITCODE
          }
